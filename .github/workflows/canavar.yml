name: AhmetCanavarVDS
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: VNC Sunucusu Kurulumu
      run: |
        echo "VNC yukleniyor..."
        choco install tightvnc -y
        # VNC sifresini "Canavar" yapalim (8 karakter siniri vardir genelde)
        & "C:\Program Files\TightVNC\tvnserver.exe" -install
        & "C:\Program Files\TightVNC\tvnserver.exe" -start
    - name: Canavara Tünel Kaz (VNC Destekli)
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: false
